<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Document Viewer | Dawit Birhanu Mulu</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0f19;
      color: white;
    }


    /* =========================
       HEADER
    ========================== */

    .viewer-header {

      position: sticky;
      top: 0;

      z-index: 1000;

      min-height: 64px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      padding: 10px 15px;

      background: rgba(11, 15, 25, 0.97);

      border-bottom:
        1px solid
        rgba(0, 234, 255, 0.25);

      backdrop-filter: blur(10px);

    }


    /* =========================
       TITLE
    ========================== */

    .viewer-title {

      color: #00eaff;

      font-size: 18px;

      font-weight: bold;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      max-width: 40%;

    }


    /* =========================
       CONTROLS
    ========================== */

    .controls {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 7px;

      flex-wrap: wrap;

    }


    .control-btn {

      border:
        1px solid
        #00eaff;

      background: transparent;

      color: #00eaff;

      border-radius: 6px;

      padding: 7px 11px;

      font-size: 14px;

      cursor: pointer;

      transition: 0.25s ease;

    }


    .control-btn:hover {

      background: #00eaff;

      color: #000;

    }


    .page-info {

      color: #cccccc;

      font-size: 13px;

      min-width: 70px;

      text-align: center;

    }


    /* =========================
       BACK BUTTON
    ========================== */

    .back-button {

      display: inline-block;

      padding: 8px 12px;

      border:
        1px solid
        #00eaff;

      border-radius: 7px;

      color: #00eaff;

      text-decoration: none;

      font-size: 14px;

      white-space: nowrap;

      transition: 0.25s ease;

    }


    .back-button:hover {

      background: #00eaff;

      color: #000;

    }


    /* =========================
       PDF AREA
    ========================== */

    #pdf-container {

      width: 100%;

      min-height:
        calc(100vh - 64px);

      padding: 25px 10px 50px;

      background: #202020;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 20px;

    }


    /* =========================
       PDF PAGE
    ========================== */

    .pdf-page {

      display: block;

      background: white;

      box-shadow:
        0 5px 25px
        rgba(0, 0, 0, 0.45);

      max-width: 100%;

      height: auto;

    }


    /* =========================
       LOADING
    ========================== */

    #loading {

      min-height: 60vh;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 15px;

      color: #cccccc;

      text-align: center;

    }


    .spinner {

      width: 42px;

      height: 42px;

      border:
        4px solid
        rgba(255,255,255,0.15);

      border-top:
        4px solid
        #00eaff;

      border-radius: 50%;

      animation:
        spin 0.9s linear infinite;

    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    /* =========================
       ERROR
    ========================== */

    #error-message {

      display: none;

      min-height: 70vh;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 30px;

    }


    .error-box {

      max-width: 500px;

      padding: 30px;

      background: #111827;

      border:
        1px solid
        rgba(255,255,255,0.1);

      border-radius: 15px;

    }


    .error-box h2 {

      color: #ff5c5c;

      margin-bottom: 12px;

    }


    .error-box p {

      color: #cccccc;

      margin-bottom: 20px;

    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 700px) {

      .viewer-header {

        padding: 9px 8px;

        gap: 6px;

      }


      .viewer-title {

        font-size: 13px;

        max-width: 30%;

      }


      .controls {

        gap: 4px;

      }


      .control-btn {

        padding: 6px 8px;

        font-size: 12px;

      }


      .page-info {

        min-width: 55px;

        font-size: 11px;

      }


      .back-button {

        padding: 7px 8px;

        font-size: 12px;

      }


      #pdf-container {

        padding:
          15px 5px 35px;

        gap: 12px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header class="viewer-header">


    <div
      id="document-title"
      class="viewer-title"
    >
      Document
    </div>


    <div class="controls">


      <button
        id="previous-page"
        class="control-btn"
        type="button"
      >
        ◀
      </button>


      <span
        id="page-info"
        class="page-info"
      >
        Page 1
      </span>


      <button
        id="next-page"
        class="control-btn"
        type="button"
      >
        ▶
      </button>


      <button
        id="zoom-out"
        class="control-btn"
        type="button"
      >
        −
      </button>


      <button
        id="zoom-reset"
        class="control-btn"
        type="button"
      >
        100%
      </button>


      <button
        id="zoom-in"
        class="control-btn"
        type="button"
      >
        +
      </button>


    </div>


    <a
      href="./index.html#documents"
      class="back-button"
    >
      ← Back
    </a>


  </header>


  <!-- =========================
       PDF CONTENT
  ========================== -->

  <main id="pdf-container">


    <div id="loading">

      <div class="spinner"></div>

      <p>
        Loading document...
      </p>

    </div>


    <div id="error-message">

      <div class="error-box">

        <h2>
          Unable to display document
        </h2>

        <p id="error-text">
          The document could not be loaded.
        </p>

        <a
          href="./index.html#documents"
          class="back-button"
        >
          ← Back to Documents
        </a>

      </div>

    </div>


  </main>


  <!-- =========================
       PDF.JS
  ========================== -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
  ></script>


  <!-- YOUR JAVASCRIPT -->

  <script src="./viewer.js"></script>


</body>

  </html>
