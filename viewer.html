<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Document Viewer | Dawit Birhanu Mulu</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #0b0f19;
      color: #ffffff;
    }


    /* =========================
       HEADER
    ========================== */

    .viewer-header {

      width: 100%;
      height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 18px;

      background: #111827;

      border-bottom:
        1px solid
        rgba(0, 234, 255, 0.25);

    }


    /* =========================
       TITLE
    ========================== */

    .viewer-title {

      color: #00eaff;

      font-size: 18px;

      font-weight: bold;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      max-width: 70%;
    }


    /* =========================
       BACK BUTTON
    ========================== */

    .back-button {

      display: inline-block;

      padding: 9px 15px;

      border:
        1px solid
        #00eaff;

      border-radius: 7px;

      color: #00eaff;

      text-decoration: none;

      transition: 0.3s ease;

      white-space: nowrap;
    }

    .back-button:hover {

      background: #00eaff;

      color: #000000;

      box-shadow:
        0 0 15px
        rgba(0, 234, 255, 0.5);
    }


    /* =========================
       PDF CONTAINER
    ========================== */

    .pdf-container {

      width: 100%;

      height:
        calc(100vh - 64px);

      background: #202020;
    }


    /* =========================
       PDF VIEWER
    ========================== */

    #pdf-viewer {

      width: 100%;

      height: 100%;

      border: none;

      display: block;

      background: #ffffff;
    }


    /* =========================
       ERROR
    ========================== */

    .error {

      display: none;

      width: 100%;

      height:
        calc(100vh - 64px);

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 30px;
    }

    .error-box {

      max-width: 500px;

      padding: 30px;

      background: #111827;

      border:
        1px solid
        rgba(255,255,255,0.1);

      border-radius: 15px;
    }

    .error h2 {

      color: #ff5c5c;

      margin-bottom: 12px;
    }

    .error p {

      color: #cccccc;

      margin-bottom: 20px;
    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

      .viewer-header {

        height: 58px;

        padding: 0 10px;
      }

      .viewer-title {

        font-size: 14px;

        max-width: 65%;
      }

      .back-button {

        padding: 7px 10px;

        font-size: 13px;
      }

      .pdf-container {

        height:
          calc(100vh - 58px);
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       VIEWER HEADER
  ========================== -->

  <header class="viewer-header">

    <div
      id="document-title"
      class="viewer-title"
    >
      Document Viewer
    </div>


    <a
      href="./index.html#documents"
      class="back-button"
    >
      ← Back
    </a>

  </header>


  <!-- =========================
       PDF VIEWER
  ========================== -->

  <main class="pdf-container">

    <iframe
      id="pdf-viewer"
      title="PDF Document Viewer"
      loading="eager"
    ></iframe>


    <!-- ERROR MESSAGE -->

    <div
      id="error-message"
      class="error"
    >

      <div class="error-box">

        <h2>
          Document Not Found
        </h2>

        <p>
          The requested document could not be loaded.
          Please return to the documents section.
        </p>

        <a
          href="./index.html#documents"
          class="back-button"
        >
          Return to Documents
        </a>

      </div>

    </div>

  </main>


  <!-- JAVASCRIPT -->

  <script src="./viewer.js"></script>

</body>

</html>
